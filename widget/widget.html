<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sutur</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;background:#07051a;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
:root{
  --text-primary:#e8e4f8;--text-secondary:#a097c4;--text-muted:rgba(160,151,196,.45);
  --violet:#8b5cf6;--violet-light:rgba(139,92,246,.18);--violet-glow:rgba(139,92,246,.35);
  --gold:#c9a227;--surface:rgba(255,255,255,.04);--border:rgba(139,92,246,.18);
}
#widget-root{position:fixed;inset:0;display:flex;flex-direction:column;align-items:flex-end;padding:14px;gap:10px;overflow-y:auto}

/* ── Bulle principale — toujours visible, point de départ de tout ── */
.main-bubble{
  width:56px;height:56px;border-radius:50%;flex-shrink:0;cursor:pointer;
  background:radial-gradient(circle,rgba(139,92,246,.5),rgba(7,5,26,.95));
  border:1.5px solid var(--violet-glow);display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;color:var(--text-primary);box-shadow:0 0 24px rgba(139,92,246,.25);
  transition:transform .15s;user-select:none;
}
.main-bubble:hover{transform:scale(1.06)}
.main-bubble:active{transform:scale(.96)}

/* ── Rangée des sous-bulles, apparaît sous la bulle principale ── */
#sub-bubbles{display:flex;flex-direction:column;gap:8px;align-items:flex-end;opacity:0;max-height:0;overflow:hidden;transition:opacity .18s}
#sub-bubbles.open{opacity:1;max-height:400px}
.sub-bubble{
  width:44px;height:44px;border-radius:50%;cursor:pointer;flex-shrink:0;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  transition:all .15s;
}
.sub-bubble:hover{background:var(--violet-light);border-color:var(--violet-glow);transform:scale(1.08)}
.sub-bubble.active{background:var(--violet-light);border-color:var(--violet-glow)}

/* ── Panneau — s'ouvre à côté de la bulle sélectionnée ── */
.panel{
  width:320px;max-height:440px;background:rgba(12,9,32,.97);border:1px solid var(--border);
  border-radius:16px;padding:14px;display:none;flex-direction:column;gap:10px;
  box-shadow:0 8px 32px rgba(0,0,0,.5);backdrop-filter:blur(12px);
}
.panel.open{display:flex}
.panel-title{font-size:10px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.panel-close{cursor:pointer;color:var(--text-muted);font-size:14px;padding:2px 6px}
.panel-close:hover{color:var(--text-primary)}

/* ── Panneau Chat ── */
#chat-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:120px;max-height:260px}
.chat-line{font-size:12.5px;line-height:1.5;padding:8px 10px;border-radius:10px;max-width:90%}
.chat-line.user{align-self:flex-end;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.25);color:var(--text-primary)}
.chat-line.ai{align-self:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text-primary)}
.chat-line.thinking{color:var(--text-muted);font-style:italic}
#chat-input-row{display:flex;gap:6px}
#chat-input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:8px 10px;color:var(--text-primary);font-size:12.5px;outline:none;resize:none;font-family:inherit}
#chat-input:focus{border-color:var(--violet-glow)}
.chat-send{width:34px;height:34px;border-radius:50%;background:var(--violet-light);border:1px solid var(--violet-glow);color:var(--text-primary);cursor:pointer;flex-shrink:0;font-size:14px}

/* ── Panneau Spotify ── */
#spotify-nowplaying{display:flex;flex-direction:column;gap:2px;align-items:center;padding:8px 0}
#spotify-track{font-size:13px;font-weight:600;color:var(--text-primary);text-align:center}
#spotify-artist{font-size:11px;color:var(--text-secondary)}
#spotify-controls{display:flex;justify-content:center;gap:14px;margin-top:6px}
.spotify-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text-primary);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.spotify-btn:hover{background:var(--violet-light);border-color:var(--violet-glow)}
#spotify-search-row{display:flex;gap:6px;margin-top:6px}
#spotify-search-input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:8px 10px;color:var(--text-primary);font-size:12.5px;outline:none}
#spotify-search-input:focus{border-color:var(--violet-glow)}
#spotify-results{display:flex;flex-direction:column;gap:4px;max-height:140px;overflow-y:auto}
.spotify-result{padding:6px 8px;border-radius:8px;font-size:11.5px;cursor:pointer;border:1px solid transparent}
.spotify-result:hover{background:rgba(139,92,246,.1);border-color:var(--border)}
.spotify-result-title{color:var(--text-primary)}
.spotify-result-artist{color:var(--text-muted);font-size:10px}

.muted-msg{color:var(--text-muted);font-size:11.5px;text-align:center;padding:14px 0}
</style>
</head>
<body>
<div id="widget-root">

  <div class="panel" id="panel-chat">
    <div class="panel-title"><span>💬 CHAT SUTUR</span><span class="panel-close" onclick="closePanel('chat')">✕</span></div>
    <div id="chat-log"></div>
    <div id="chat-input-row">
      <textarea id="chat-input" rows="1" placeholder="Demande quelque chose à Sutur..."></textarea>
      <button class="chat-send" onclick="widgetSendChat()">➤</button>
    </div>
  </div>

  <div class="panel" id="panel-spotify">
    <div class="panel-title"><span>🎵 SPOTIFY</span><span class="panel-close" onclick="closePanel('spotify')">✕</span></div>
    <div id="spotify-nowplaying"><div class="muted-msg">Chargement...</div></div>
    <div id="spotify-controls">
      <button class="spotify-btn" onclick="spotifyAction('previous')">⏮</button>
      <button class="spotify-btn" id="spotify-playpause">⏸</button>
      <button class="spotify-btn" onclick="spotifyAction('next')">⏭</button>
    </div>
    <div id="spotify-search-row">
      <input id="spotify-search-input" placeholder="Titre à lancer..." onkeydown="if(event.key==='Enter')spotifySearch()">
      <button class="chat-send" onclick="spotifySearch()">🔍</button>
    </div>
    <div id="spotify-results"></div>
  </div>

  <div id="sub-bubbles">
    <div class="sub-bubble" id="bubble-chat" onclick="togglePanel('chat')" title="Chat Sutur">💬</div>
    <div class="sub-bubble" id="bubble-spotify" onclick="togglePanel('spotify')" title="Spotify">🎵</div>
  </div>

  <div class="main-bubble" id="main-bubble" onclick="toggleSubBubbles()">S</div>
</div>

<script src="widget.js"></script>
</body>
</html>
